name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Bot content commits cannot trigger another push workflow.
  workflow_run:
    workflows: [Sync content and generate HTML]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://nahuelmg.github.io/cosmo
      IS_PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A sync run's head SHA predates the content commit it just pushed.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build plain HTML
        run: |
          if [ "$IS_PRODUCTION" = true ]; then
            python -m tools.build
          else
            python -m tools.build --preview
          fi
      - run: python -m tools.check dist
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
        env:
          CHROME_PATH: chromium
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
