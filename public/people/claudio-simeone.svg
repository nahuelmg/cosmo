<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Claudio Simeone monogram placeholder">
  <title>Claudio Simeone</title>
  <defs>
    <style>
      .star { fill: oklch(0.55 0.015 60); }
      .orbit { fill: none; stroke: oklch(0.55 0.015 60); stroke-width: 1.25; stroke-dasharray: 2 5; opacity: 0.45; }
      .monogram { fill: oklch(0.55 0.12 45); font-family: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif; font-weight: 600; font-size: 190px; letter-spacing: -4px; }
    </style>
  </defs>

  <!-- Upper starfield — irregular scatter, varied radii + opacities -->
  <circle class="star" cx="58"  cy="68"  r="1.6" opacity="0.85"/>
  <circle class="star" cx="122" cy="44"  r="0.9" opacity="0.55"/>
  <circle class="star" cx="196" cy="92"  r="2.2" opacity="0.9"/>
  <circle class="star" cx="268" cy="56"  r="1.1" opacity="0.6"/>
  <circle class="star" cx="336" cy="118" r="1.7" opacity="0.8"/>
  <circle class="star" cx="362" cy="38"  r="0.8" opacity="0.45"/>
  <circle class="star" cx="44"  cy="158" r="1.1" opacity="0.6"/>
  <circle class="star" cx="108" cy="196" r="0.7" opacity="0.4"/>
  <circle class="star" cx="248" cy="164" r="1.4" opacity="0.7"/>
  <circle class="star" cx="318" cy="212" r="0.9" opacity="0.5"/>
  <circle class="star" cx="78"  cy="238" r="0.8" opacity="0.45"/>
  <circle class="star" cx="172" cy="228" r="1.2" opacity="0.65"/>

  <!-- Orbital ellipse — tilted, dotted, passes behind the monogram -->
  <ellipse class="orbit" cx="200" cy="300" rx="178" ry="52" transform="rotate(-14 200 300)"/>

  <!-- Monogram — serif initials, visually centred on the lower two-thirds -->
  <text x="200" y="300" text-anchor="middle" dominant-baseline="central" class="monogram">CS</text>

  <!-- Lower accents — a handful of stars to balance composition -->
  <circle class="star" cx="72"  cy="428" r="1.3" opacity="0.6"/>
  <circle class="star" cx="338" cy="454" r="1.6" opacity="0.7"/>
  <circle class="star" cx="378" cy="396" r="0.9" opacity="0.5"/>
  <circle class="star" cx="156" cy="470" r="0.8" opacity="0.4"/>
</svg>
